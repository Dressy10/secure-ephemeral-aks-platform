apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kyverno
  targetNamespace: kyverno
  install:
    createNamespace: true
  chart:
    spec:
      chart: kyverno
      version: 3.3.9
      sourceRef:
        kind: HelmRepository
        name: kyverno
  # One small node: run only the admission controller, single replica.
  values:
    admissionController:
      replicas: 1
      container:
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 384Mi }
    backgroundController: { enabled: false }
    cleanupController: { enabled: false }
    reportsController: { enabled: false }
