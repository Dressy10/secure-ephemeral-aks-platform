# Steady synthetic traffic so SLO metrics and canary analysis have data.
# Lives in `observability` (not `payments`) because the payments admission policy only allows signed ledger images.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loadgen }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loadgen }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null -X POST http://ledger.payments.svc/transfers \
                  -d "{\"from\":\"acct-treasury\",\"to\":\"acct-a\",\"amount_minor\":1,\"ref\":\"lg-$(date +%s%N)\"}"
                sleep 0.2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
