apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: argo
  namespace: flux-system
spec:
  interval: 1h
  url: https://argoproj.github.io/argo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-rollouts
  namespace: flux-system
spec:
  interval: 10m
  releaseName: argo-rollouts
  targetNamespace: argo-rollouts
  install:
    createNamespace: true
  chart:
    spec:
      chart: argo-rollouts
      version: 2.43.8
      sourceRef:
        kind: HelmRepository
        name: argo
  values:
    installCRDs: true
    controller:
      replicas: 1
      resources:
        requests: { cpu: 25m, memory: 48Mi }
        limits: { memory: 128Mi }
    dashboard:
      enabled: false
