name: build

# Supply chain for the ledger image: build -> Trivy gate -> push -> Syft SBOM -> Cosign (keyless) sign
# -> SBOM attestation -> SLSA build provenance. No signing keys or registry passwords exist:
# everything authenticates with this workflow's GitHub OIDC token.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write # commit the new digest to gitops/
  packages: write # push to GHCR
  id-token: write # keyless signing + provenance
  attestations: write

env:
  IMAGE: ghcr.io/dressy10/ledger

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: app/ledger
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: app/ledger
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          provenance: false # SLSA provenance is attested separately below

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM attestation (keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Point GitOps at the new digest
        run: |
          f=gitops/apps/ledger/overlays/dev/kustomization.yaml
          sed -i -E "s|^(\s*digest:).*|\1 ${{ steps.push.outputs.digest }}|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet || { git commit -m "gitops: deploy ledger ${{ steps.push.outputs.digest }}"; git push; }
