name: demo-unsigned

# Pushes a real, working image that is deliberately NOT scanned, signed or attested, so the
# admission-control demo can show Kyverno rejecting an image that exists in our registry path.
# Manual only. It never touches gitops/, so nothing deploys it.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-unsigned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app/ledger
          push: true
          tags: ghcr.io/dressy10/ledger:unsigned-demo
          provenance: false
